function openCustomForwardComposer() {
  if (!currentChat) return;
  const senderId = normalizeMessageId(selfUser && selfUser.user_id);
  const senderName = String((selfUser && selfUser.name) || 'You');
  openForwardComposer({
    mode: 'custom',
    nodes: [{sender_id: senderId, sender_name: senderName, content: ''}],
  });
}

function openForwardComposer({mode, nodes}) {
  closeForwardComposer();
  const draftNodes = nodes.map(node => ({...node}));
  let destination = currentChat || '';
  let sending = false;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay forward-compose-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box forward-compose-modal';
  box.innerHTML = `
    <div class="forward-compose-head">
      <div><h2>${mode === 'selected' ? 'Forward messages' : 'New combined forward'}</h2><span>${mode === 'selected' ? `${nodes.length} selected messages` : 'Custom nodes'}</span></div>
      <button class="icon-button forward-compose-close" type="button" aria-label="Close"><svg><use href="#icon-x"/></svg></button>
    </div>
    <section class="forward-destination">
      <label for="forwardChatSearch">Destination</label>
      <div class="forward-chat-search"><svg><use href="#icon-search"/></svg><input id="forwardChatSearch" type="search" placeholder="Search conversations" autocomplete="off"></div>
      <div class="forward-chat-list" id="forwardChatList"></div>
    </section>
    <section class="forward-node-section" id="forwardNodeSection"></section>
    <div class="forward-compose-error" id="forwardComposeError" role="alert"></div>
    <div class="forward-compose-actions">
      <button class="forward-secondary-button" id="forwardCancel" type="button">Cancel</button>
      <button class="forward-primary-button" id="forwardSend" type="button"><svg><use href="#icon-send"/></svg><span>Send</span></button>
    </div>`;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  forwardComposerOverlay = overlay;

  const chatSearch = box.querySelector('#forwardChatSearch');
  const chatList = box.querySelector('#forwardChatList');
  const nodeSection = box.querySelector('#forwardNodeSection');
  const error = box.querySelector('#forwardComposeError');
  const send = box.querySelector('#forwardSend');

  function setError(text = '') {
    error.textContent = text;
    error.classList.toggle('show', !!text);
  }

  function destinationChats() {
    const chats = Array.isArray(allChats) ? allChats.slice() : [];
    if (currentChat && !chats.some(chat => chat.chat_id === currentChat)) {
      chats.unshift({chat_id: currentChat, name: $('chatTitle').textContent || currentChat});
    }
    return chats;
  }

  function renderDestinations() {
    const query = chatSearch.value.trim().toLocaleLowerCase();
    const chats = destinationChats().filter(chat => !query || [chat.name, chat.chat_id, chat.last_text]
      .some(value => String(value || '').toLocaleLowerCase().includes(query))).slice(0, 100);
    chatList.replaceChildren();
    if (!chats.length) {
      const empty = document.createElement('div');
      empty.className = 'forward-chat-empty';
      empty.textContent = 'No matching conversations';
      chatList.appendChild(empty);
      return;
    }
    for (const chat of chats) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'forward-chat-option' + (chat.chat_id === destination ? ' active' : '');
      button.appendChild(createAvatar('forward-chat-avatar', chat.avatar_url || avatarUrlForChat(chat.chat_id), chat.name || chat.chat_id));
      const text = document.createElement('span');
      text.className = 'forward-chat-copy';
      const name = document.createElement('strong');
      name.textContent = chat.name || chat.chat_id;
      const id = document.createElement('small');
      id.textContent = chat.chat_id;
      text.append(name, id);
      const check = document.createElement('svg');
      check.className = 'forward-chat-check';
      check.innerHTML = '<use href="#icon-check"/>';
      button.append(text, check);
      button.addEventListener('click', () => {
        destination = chat.chat_id;
        setError();
        renderDestinations();
      });
      chatList.appendChild(button);
    }
  }

  function nodeTool(icon, label, onClick, disabled = false) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-button forward-node-tool';
    button.setAttribute('aria-label', label);
    button.dataset.tooltip = label;
    button.disabled = disabled;
    button.innerHTML = `<svg><use href="#icon-${icon}"/></svg>`;
    button.addEventListener('click', onClick);
    return button;
  }

  function renderNodeEditors() {
    nodeSection.replaceChildren();
    if (mode !== 'custom') {
      nodeSection.classList.add('selected-forward-summary');
      const summary = document.createElement('div');
      summary.className = 'selected-forward-count';
      summary.innerHTML = '<svg><use href="#icon-layers"/></svg>';
      const text = document.createElement('span');
      text.textContent = `${draftNodes.length} selected messages`;
      summary.appendChild(text);
      nodeSection.appendChild(summary);
      return;
    }
    nodeSection.classList.remove('selected-forward-summary');
    const heading = document.createElement('div');
    heading.className = 'forward-node-heading';
    const title = document.createElement('strong');
    title.textContent = `Nodes (${draftNodes.length})`;
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'forward-add-node';
    add.disabled = draftNodes.length >= 100;
    add.innerHTML = '<svg><use href="#icon-plus"/></svg><span>Add node</span>';
    add.addEventListener('click', () => {
      const previous = draftNodes[draftNodes.length - 1] || {};
      draftNodes.push({
        sender_id: previous.sender_id || '',
        sender_name: previous.sender_name || '',
        content: '',
      });
      renderNodeEditors();
      nodeSection.querySelector('.forward-node-editor:last-of-type textarea')?.focus();
    });
    heading.append(title, add);
    nodeSection.appendChild(heading);

    draftNodes.forEach((node, index) => {
      const row = document.createElement('div');
      row.className = 'forward-node-editor';
      const rowHead = document.createElement('div');
      rowHead.className = 'forward-node-editor-head';
      const number = document.createElement('strong');
      number.textContent = `Node ${index + 1}`;
      const tools = document.createElement('div');
      tools.className = 'forward-node-tools';
      tools.append(
        nodeTool('chevron-up', 'Move up', () => {
          [draftNodes[index - 1], draftNodes[index]] = [draftNodes[index], draftNodes[index - 1]];
          renderNodeEditors();
        }, index === 0),
        nodeTool('chevron-down', 'Move down', () => {
          [draftNodes[index], draftNodes[index + 1]] = [draftNodes[index + 1], draftNodes[index]];
          renderNodeEditors();
        }, index === draftNodes.length - 1),
        nodeTool('trash', 'Remove node', () => {
          draftNodes.splice(index, 1);
          renderNodeEditors();
        }, draftNodes.length === 1),
      );
      rowHead.append(number, tools);

      const identity = document.createElement('div');
      identity.className = 'forward-node-identity';
      const idLabel = document.createElement('label');
      idLabel.textContent = 'QQ ID';
      const idInput = document.createElement('input');
      idInput.type = 'text';
      idInput.inputMode = 'numeric';
      idInput.maxLength = 15;
      idInput.value = node.sender_id;
      idInput.addEventListener('input', () => { node.sender_id = idInput.value; setError(); });
      idLabel.appendChild(idInput);
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Sender name';
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.maxLength = 100;
      nameInput.value = node.sender_name;
      nameInput.addEventListener('input', () => { node.sender_name = nameInput.value; setError(); });
      nameLabel.appendChild(nameInput);
      identity.append(idLabel, nameLabel);

      const contentLabel = document.createElement('label');
      contentLabel.className = 'forward-node-content-label';
      contentLabel.textContent = 'Content';
      const content = document.createElement('textarea');
      content.maxLength = 20000;
      content.rows = 4;
      content.value = node.content;
      content.addEventListener('input', () => { node.content = content.value; setError(); });
      contentLabel.appendChild(content);
      row.append(rowHead, identity, contentLabel);
      nodeSection.appendChild(row);
    });
  }

  function validatedNodes() {
    if (!destination) throw new Error('Choose a destination.');
    if (mode !== 'custom') return draftNodes;
    let total = 0;
    return draftNodes.map((node, index) => {
      const senderId = String(node.sender_id || '').trim();
      const senderName = String(node.sender_name || '').trim();
      const content = String(node.content || '');
      if (!/^\d{1,15}$/.test(senderId) || Number(senderId) <= 0) throw new Error(`Node ${index + 1}: enter a valid QQ ID.`);
      if (!senderName || senderName.length > 100) throw new Error(`Node ${index + 1}: enter a sender name.`);
      if (!content.trim()) throw new Error(`Node ${index + 1}: enter content.`);
      total += content.length;
      if (total > 100000) throw new Error('Combined content exceeds 100,000 characters.');
      return {sender_id: senderId, sender_name: senderName, content};
    });
  }

  async function submitForward() {
    if (sending) return;
    let payloadNodes;
    try {
      payloadNodes = validatedNodes();
    } catch (validationError) {
      setError(validationError.message);
      return;
    }
    sending = true;
    send.disabled = true;
    send.classList.add('sending');
    send.querySelector('span').textContent = 'Sending';
    setError();
    try {
      const response = await api('/api/send-forward', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: destination, nodes: payloadNodes}),
      });
      const result = await readJsonResponse(response);
      if (!response.ok || !result.ok) throw new Error(result.error || 'Forward send failed');
      closeForwardComposer();
      if (mode === 'selected') cancelMessageSelection();
      showToast('Combined forward sent');
      loadChats();
    } catch (sendError) {
      setError(sendError.message || String(sendError));
      sending = false;
      send.disabled = false;
      send.classList.remove('sending');
      send.querySelector('span').textContent = 'Send';
    }
  }

  chatSearch.addEventListener('input', renderDestinations);
  box.querySelector('.forward-compose-close').addEventListener('click', closeForwardComposer);
  box.querySelector('#forwardCancel').addEventListener('click', closeForwardComposer);
  send.addEventListener('click', submitForward);
  overlay.addEventListener('pointerdown', event => {
    if (event.target === overlay) closeForwardComposer();
  });
  renderDestinations();
  renderNodeEditors();
  if (mode === 'custom') nodeSection.querySelector('textarea')?.focus();
  else chatSearch.focus();
}

// @ autocomplete
function showAtDropdown(query) {
  const dd = $('atDropdown');
  if (!currentChat || !currentChat.startsWith('group_')) {
    dd.classList.remove('show');
    return;
  }
  const entries = Object.entries(nicknames).filter(([uid, name]) =>
    String(name).toLowerCase().includes(query.toLowerCase()) || uid.includes(query)
  ).slice(0, 8);
  if (!entries.length) { dd.classList.remove('show'); return; }
  dd.replaceChildren();
  for (const [uid, name] of entries) {
    const item = document.createElement('div');
    item.className = 'at-item';
    item.dataset.uid = uid;
    item.dataset.name = String(name);
    item.addEventListener('mousedown', e => {
      e.preventDefault();
      insertAt(uid);
    });

    item.append(document.createTextNode(String(name)));
    const uidEl = document.createElement('span');
    uidEl.className = 'uid';
    uidEl.textContent = uid;
    item.appendChild(uidEl);
    dd.appendChild(item);
  }
  dd.classList.add('show');
}

function hideAtDropdown() {
  $('atDropdown').classList.remove('show');
  atSearch = null;
}

function activeSlashToken(input) {
  const cursor = input.selectionStart;
  if (cursor !== input.selectionEnd) return null;
  const before = input.value.substring(0, cursor);
  const match = before.match(/(?:^|\s)\/([A-Za-z0-9\u4e00-\u9fff]*)$/);
  if (!match) return null;
  const slashIdx = cursor - match[1].length - 1;
  return {start: slashIdx, end: cursor, query: match[1]};
}

function showEmojiDropdown(queryOrToken, options = {}) {
  const dd = $('emojiDropdown');
  const query = typeof queryOrToken === 'string' ? queryOrToken : (queryOrToken && queryOrToken.query) || '';
  dd.replaceChildren();
  const list = document.createElement('div');
  list.className = 'emoji-list';
  if (options.mode === 'faceReply' || options.mode === 'composerPicker') {
    const search = document.createElement('input');
    search.className = 'emoji-search';
    search.type = 'search';
    search.placeholder = 'Search faces';
    search.value = query;
    search.addEventListener('input', () => renderEmojiItems(list, search.value, options));
    search.addEventListener('mousedown', e => e.stopPropagation());
    dd.append(search, list);
    renderEmojiItems(list, query, options);
  } else {
    renderEmojiItems(list, query, options);
    if (!list.children.length) {
      dd.classList.remove('show');
      return;
    }
    dd.appendChild(list);
  }
  dd.classList.toggle('fixed', !!options.fixed);
  if (options.fixed && options.position) {
    dd.style.left = '0px';
    dd.style.top = '0px';
  } else {
    dd.style.left = '';
    dd.style.top = '';
  }
  dd.classList.add('show');
  if (options.fixed && options.position) {
    const rect = dd.getBoundingClientRect();
    const left = Math.max(8, Math.min(options.position.x, window.innerWidth - rect.width - 8));
    const top = Math.max(8, Math.min(options.position.y, window.innerHeight - rect.height - 8));
    dd.style.left = `${left}px`;
    dd.style.top = `${top}px`;
    const search = dd.querySelector('.emoji-search');
    if (search) search.focus();
  }
}

function renderEmojiItems(container, query, options = {}) {
  const entries = options.mode === 'faceReply'
    ? matchingNamedFaces(query, {entries: reactionFaceEntries(), limit: 0})
    : matchingNamedFaces(query, {limit: options.mode === 'composerPicker' ? 0 : 12});
  container.replaceChildren();
  if (!entries.length && options.mode === 'faceReply') {
    const empty = document.createElement('div');
    empty.className = 'emoji-empty';
    empty.textContent = 'No matching faces';
    container.appendChild(empty);
    return;
  }
  for (const [faceId, info] of entries) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'emoji-item';
    item.dataset.faceId = faceId;
    item.title = faceLabel(faceId);
    item.addEventListener('mousedown', e => {
      e.preventDefault();
      if (options.mode === 'faceReply') {
        sendFaceReply(faceReplyMessageId, faceId);
      } else {
        insertFaceToken(faceId);
      }
    });

    item.appendChild(createFaceNode(faceId));
    const name = document.createElement('span');
    name.className = 'emoji-item-name';
    name.textContent = info.name;
    const id = document.createElement('span');
    id.className = 'emoji-item-id';
    id.textContent = `[face:${faceId}]`;
    item.append(name, id);
    container.appendChild(item);
  }
}

function hideEmojiDropdown() {
  const dd = $('emojiDropdown');
  dd.classList.remove('show', 'fixed');
  dd.style.left = '';
  dd.style.top = '';
  slashSearch = null;
  faceReplyMessageId = null;
}

function updateEmojiDropdown() {
  const input = $('sendInput');
  const token = activeSlashToken(input);
  if (!token) {
    hideEmojiDropdown();
    return;
  }
  slashSearch = token;
  showEmojiDropdown(token);
}

function insertFaceToken(faceId) {
  const input = $('sendInput');
  const token = activeSlashToken(input) || slashSearch;
  const val = input.value;
  const insert = `[face:${faceId}]`;
  const start = token ? token.start : input.selectionStart;
  const end = token ? token.end : input.selectionEnd;
  input.value = val.substring(0, start) + insert + val.substring(end);
  const pos = start + insert.length;
  hideEmojiDropdown();
  input.focus();
  input.setSelectionRange(pos, pos);
  updateComposerState();
}

function insertAt(uid) {
  if (!currentChat || !currentChat.startsWith('group_')) {
    hideAtDropdown();
    return;
  }
  const input = $('sendInput');
  const val = input.value;
  const atIdx = val.lastIndexOf('@');
  if (atIdx >= 0) {
    input.value = val.substring(0, atIdx) + `@[${uid}]` + val.substring(input.selectionStart);
  }
  hideAtDropdown();
  input.focus();
}

$('sendInput').addEventListener('input', function() {
  updateComposerState();
  const val = this.value;
  const cursor = this.selectionStart;
  const before = val.substring(0, cursor);
  const atMatch = before.match(/@([^@\s]*)$/);
  if (atMatch) {
    atSearch = atMatch[1];
    showAtDropdown(atSearch);
  } else {
    hideAtDropdown();
  }
  updateEmojiDropdown();
});

$('sendInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if ($('atDropdown').classList.contains('show')) {

      if (first) {
        e.preventDefault();
        insertAt(first.dataset.uid);
        return;
      }
    }
    doSend();
  } else if (e.key === 'Escape') {
    hideAtDropdown();
    hideEmojiDropdown();
  }
});

$('backButton').addEventListener('click', showChatList);
$('pluginsButton').addEventListener('click', showPluginsPanel);

function updateComposerState() {
  $('sendButton').disabled = !currentChat || !$('sendInput').value.trim();
  $('customForwardButton').disabled = !currentChat;
}

function syncThemeControl() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('themeButton').setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
  $('themeButton').dataset.tooltip = dark ? 'Light theme' : 'Dark theme';
}

syncThemeControl();
updateComposerState();

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const token = document.cookie.match(/(?:^|;\s*)token=([^;]*)/)?.[1] || '';
  ws = new WebSocket(`${proto}//${location.host}/ws${token ? '?token=' + encodeURIComponent(token) : ''}`);
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'new_message' && d.data) {
        if (d.data.chat_id === currentChat) {
          const existing = findMessageElement(d.data);
          upsertLoadedMessage(d.data);
          if (existing) {
            renderMessageElement(existing, d.data);
            syncMessageSelectionUI();
          } else {
            appendMessage(d.data);
          }
        }
        loadChats();
      } else if (d.type === 'emoji_like' && d.data) {
        applyEmojiLikeEvent(d.data);
      } else if (d.type === 'message_update' && d.data) {
        applyMessageUpdate(d.data);
      }
    } catch {}
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
  ws.onerror = () => {};
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Scroll up to load more
$('messagesScroll').addEventListener('click', function(e) {
  if (!selectingMessages) return;
  const messageElement = e.target.closest('.msg');
  if (!messageElement || !this.contains(messageElement)) return;
  const message = messageIndex.get(normalizeMessageId(messageElement.dataset.messageId));
  if (!canSelectMessage(message)) return;
  e.preventDefault();
  e.stopPropagation();
  toggleMessageSelection(message);
}, true);

$('messagesScroll').addEventListener('scroll', function() {
  if (userScrollActive) hideMessageMenu();
  userScrollActive = false;
  if (this.scrollTop < 30 && currentChat && Date.now() - lastLoadTime > 500) {
    const first = this.querySelector('.msg');
    if (first && first.dataset.time) {
      loadMessages(currentChat, Number(first.dataset.time), chatLoadToken);
    }
  }
});

// Boot
(async () => {
  const ok = await checkAuth();
  if (ok) {
    authed = true;
    $('loginOverlay').style.display = 'none';
    init();
  } else {
    $('loginOverlay').style.display = 'flex';
  }
})();
</script>
